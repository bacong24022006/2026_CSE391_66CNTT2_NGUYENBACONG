<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>baiTH1</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        background: #e9e9e9;
        display: flex;
        justify-content: center;
        padding: 40px;
      }

      .container {
        background: #fff;
        width: 800px;
        padding: 30px;
        border: 2px solid #333;
      }

      h2 {
        margin-bottom: 25px;
        color: #555;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .row {
        display: flex;
        gap: 15px;
      }

      .row input {
        flex: 1;
      }

      input,
      textarea {
        padding: 12px;
        border: 1px solid #ccc;
        outline: none;
        font-size: 14px;
      }

      textarea {
        resize: none;
        height: 180px;
      }

      .bottom {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
      }

      button {
        background: #6bb3e0;
        color: white;
        border: none;
        padding: 10px 20px;
        cursor: pointer;
      }

      button:hover {
        background: #4da1d6;
      }

      .note {
        color: #888;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Get in touch with us by filling contact form below</h2>

      <form>
        <div class="row">
          <input type="text" placeholder="* Enter your full name" />
          <input type="email" placeholder="* Enter your email address" />
        </div>

        <input type="text" placeholder="Enter your subject" />

        <textarea placeholder="* Your message here..."></textarea>

        <div class="bottom">
          <button type="submit">Send message</button>
          <div class="note">* Please fill all required form field, thanks!</div>
        </div>
      </form>
    </div>
  </body>
</html>
